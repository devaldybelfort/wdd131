<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form">
    <meta name="author" content="De-valdy Belfort">

    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>

        <form method="get" action="review.html">

            <!-- Product -->

            <div class="form-group">

                <label for="product">
                    Product Name *
                </label>

                <select id="product" name="product" required>

                    <option value="" disabled selected>
                        Select a Product ...
                    </option>

                </select>

            </div>

            <!-- Rating -->

            <div class="form-group">

                <p>Overall Rating *</p>

                <div class="rating">

                    <input type="radio" id="star1" name="rating" value="1" required>
                    <label for="star1">☆</label>

                    <input type="radio" id="star2" name="rating" value="2">
                    <label for="star2">☆☆</label>

                    <input type="radio" id="star3" name="rating" value="3">
                    <label for="star3">☆☆☆</label>

                    <input type="radio" id="star4" name="rating" value="4">
                    <label for="star4">☆☆☆☆</label>

                    <input type="radio" id="star5" name="rating" value="5">
                    <label for="star5">☆☆☆☆☆</label>

                </div>

            </div>

            <!-- Date -->

            <div class="form-group">

                <label for="installDate">
                    Date of Installation *
                </label>

                <input type="date" id="installDate" name="installDate" required>

            </div>

            <!-- Features -->

            <div class="form-group">

                <p>Useful Features</p>

                <div class="checkbox-group">

                    <input type="checkbox" id="durability" name="features" value="Durability">

                    <label for="durability">
                        Durability
                    </label>

                    <br>

                    <input type="checkbox" id="ease" name="features" value="Ease of Use">

                    <label for="ease">
                        Ease of Use
                    </label>

                    <br>

                    <input type="checkbox" id="performance" name="features" value="Performance">

                    <label for="performance">
                        Performance
                    </label>

                    <br>

                    <input type="checkbox" id="design" name="features" value="Design">

                    <label for="design">
                        Design
                    </label>

                </div>

            </div>

            <!-- Review -->

            <div class="form-group">

                <label for="review">
                    Written Review
                </label>

                <textarea id="review" name="review" rows="5" placeholder="Write your review here...">
</textarea>

            </div>

            <!-- User Name -->

            <div class="form-group">

                <label for="username">
                    Your Name
                </label>

                <input type="text" id="username" name="username">

            </div>

            <!-- Submit -->

            <div class="form-group">

                <input type="submit" value="Submit Review" class="submit-btn">

            </div>

        </form>

    </main>

    <footer>

        <p>
            &copy;
            <span id="currentyear"></span>
            De-valdy Belfort
        </p>

        <p id="lastModified"></p>

    </footer>

</body>

</html>
